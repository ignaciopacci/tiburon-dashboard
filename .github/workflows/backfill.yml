name: Backfill Cerda
on:
  workflow_dispatch:
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install playwright pdfplumber google-auth google-api-python-client openpyxl requests && playwright install chromium
      - name: Run backfill
        env:
          AMS_USUARIO: ${{ secrets.AMS_USUARIO }}
          AMS_PASSWORD: ${{ secrets.AMS_PASSWORD }}
          AMS_EMPRESA_1: ${{ secrets.AMS_EMPRESA_1 }}
          AMS_EMPRESA_2: ${{ secrets.AMS_EMPRESA_2 }}
          GH_TOKEN_PUSH: ${{ secrets.GH_TOKEN_PUSH }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python backfill_cerda.py
