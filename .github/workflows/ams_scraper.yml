name: AMS Scraper

on:
  schedule:
    - cron: '0 15 * * 1-5'
    - cron: '0 19 * * 1-5'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_TOKEN_PUSH }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

       - name: Install dependencies
        run: pip install playwright pdfplumber dropbox requests google-auth google-auth-httplib2 google-api-python-client openpyxl && python -m playwright install chromium

      - name: Run scraper
        env:
          AMS_USUARIO: ${{ secrets.AMS_USUARIO }}
          AMS_PASSWORD: ${{ secrets.AMS_PASSWORD }}
          AMS_EMPRESA_1: ${{ secrets.AMS_EMPRESA_1 }}
          AMS_EMPRESA_2: ${{ secrets.AMS_EMPRESA_2 }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          GH_TOKEN_PUSH: ${{ secrets.GH_TOKEN_PUSH }}
        run: python scraper.py

      - name: Keep workflow alive
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git pull --rebase
          git commit --allow-empty -m "keep-alive $(date '+%Y-%m-%d %H:%M')"
          git push
